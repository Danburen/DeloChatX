# 【自2.0.0更新启用】
# 此文件的版本，通常不需要改变，检测更新需要用到
config-version: 2.0.1
# 广播顺序是否打乱
random: true
# 每次广播的间隔(秒)
# 如果是大型服务器，请将此间隔适当延长，避免占用过多的服务器资源。
interval: 120
# 全局定时广播，对所有服务器都生效
# 【请注意】
# 1. 当全局广播被启用的时候 message-list 也就是 广播内容 会合并(全局广播的在最上面)
# 2. 区服广播的 广播前缀(prefix) 的优先级最高(覆盖掉全局广播)
global:
  enable: true
  # 显示广播的前缀
  prefix: "§7[§b服务器娘§7]§r §8:§r"
  # 广播欢迎消息(会覆盖区服广播的配置如果global被启用)
  message-list:
    - "欢迎进入{proxy}，快来和大家一起冒险吧！"
    - "本服§r每日§a活跃§r玩家有机会获得丰厚奖励！"
    - "§c注意：§r请遵守服务器规则，共同创建和谐的游戏环境。"
    - "§f我们有专属的§9自定义插件§r，带来不一样的游戏体验！"
    - "§d服务器§r内有丰富的§a游戏模式§r，快来体验吧！"
    - "§7不要忘了加入我们的§bQQ群§r，获取最新动态和活动信息！"
    - "§f欢迎所有新玩家加入§r，任何问题请向管理员求助！"
    - "§e快邀请你的朋友们一起来§g玩耍§r吧，更多精彩等着你！"
    - "§a欢迎大家来到§7{server}§r，祝您游戏愉快！"
    - "§5全服§r§c活动§r即将开始，记得准时参加哦！"
    - "§d感谢您的支持与参与，我们会继续为大家提供更好的服务！"

# 区服局部定时广播
# 【请注意】
# 1. 若 global 全局广播 enable  = false 则只会单独广播区服的
# 2. channel-list 以及 server-list 所包括的所有服务器和频道中的服务器均会广播
# 3. 若一个或多个channel或者server在多个 区服广播 当中
#     i. prefix 仅会继承最后一个广播的 prefix
#     ii. 不同区服广播中所含相同的消息会合并重复消息不会增加出现概率
# 4. 若出现相同的 区服广播 名称，则仅会读取首次读取的 区服广播
locale:
  enable: true
  broadcast-list:
    # server-list 对应 (插件 config 以及velocity -> Velocity.toml server中对应的服务器id)
    # channel-list 对应 config.yml 中的 channel-list
    # 子服的广播会选择合并掉全局广播(全局广播必须被应用也就是 enable = true才会生效)
    example:
      enable: true
      prefix: "[§a服务器娘§r] §8:§r"
      message-list:
        - "服务器正在§a搭建§r中，更多精彩内容即将呈现。"
        - "§6欢迎§r加入服务器官方群"
        - "欢迎加入服务器大家庭"
        - "§d服务器§r内有丰富的§a游戏模式§r，快来体验吧！"
      channel-list:
        - login
      server-list:
        -
    example2:
      enable: false
      prefix: "[§a服务器娘§r] §8:§r"
      message-list:
        - "服务器正在§a搭建§r中，更多精彩内容即将呈现。"
        - "§6欢迎§r加入服务器官方群"
        - "欢迎加入服务器大家庭"
        - "§b新手村§r已开启，来吧！新玩家，开始您的冒险吧！"
      channel-list:
        - lobby
        - games
        - survive
      server-list:
        -

#################################
# 以下是关于玩家行为触发的广播消息配置 #
################################

# 玩家加入代理服（群组服）的时候广播消息
welcome-broadcast:
  enable: true
  # 是否仅在首次加入代理服的时候进行广播
  only-first-join: false
  message: "欢迎加入§5群组§r!"

# 自 2.1 版本启用，统一管理玩家加入/离开服务器、代理服、频道的广播消息
# 请注意，我们调整了广播消息的相关逻辑，这与 1.3 版本有一定的区别，我们采用一种层级广播的方式来处理玩家加入，离开消息广播，以下是场景示例：
# Level3：玩家在同 channel 下切换 backend，则对应的 backend 会发送离开消息，新的 backend 会发送加入消息，channel 不会发送任何消息
# Level2：玩家在代理服内（不离开代理服）切换 backend，同时切换 channel，则对应的 backend 会发送离开消息，
#       新的 backend 会发送加入消息，旧的 channel 和 backend 会发送离开消息，新的 channel 会发送加入消息。
# Level1：玩家加入/离开代理服（群组服）的时候，代理服会发送加入/离开消息，channel 和 backend 会发送加入/离开消息。
#
# log-to-console 是否在终端输出玩家玩家广播的消息
# hierarchical-overlay 是否启用层级覆盖模式（true=只显示最高层级消息，false=显示所有层级消息）
# enable 是否启用玩家加入/离开服务器、代理服、频道的广播消息，会影响层级广播发送的消息。
# scope 表示广播的范围，server=只广播给相关服务器，channel=广播给同频道的所有服务器或相关的频道所有服务器，proxy=广播给所有服务器
entry-broadcast:
  log-to-console: true
  # true = 层级覆盖模式（默认）：只显示最高层级的消息
  # false = 层级广播模式：显示所有适用层级的消息
  hierarchical-overlay: true
  backend:
    enable: true
    scope: server
    join-message: "§a(+)§r{Group}{Prefix}{Player}{Suffix} 加入了 {channel}{Server}"
    leave-message: "§c(-)§r{Group}{Prefix}{Player}{Suffix} 离开了 {channel}{Server}"
  channel:
    enable: true
    scope: channel
    join-message: "§7(+)§r{Group}{Prefix}{Player}{Suffix} 加入了 {channel}"
    leave-message: "§7(-)§r{Group}{Prefix}{Player}{Suffix} 离开了 {channel}"
  proxy:
    enable: true
    scope: proxy
    join-message: "§7[+]§r{Group}{Prefix}{Player}{Suffix} 加入了 {Proxy}"
    leave-message: "§7[-]§r{Group}{Prefix}{Player}{Suffix} 离开了 {Proxy}"